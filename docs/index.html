<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVAILT — Discover local services</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="page-wrap">
    <div id="header-mount"></div>
    <main class="main-content">
      <section class="hero" aria-label="Hero">
        <div class="hero-bg" role="presentation"></div>
        <div class="hero-inner">
          <h1>Discover Local Services</h1>
          <p class="hero-sub">
            Book catering, venues, events, wellness, home help, and more — full width, fast checkout, trusted providers.
          </p>
          <form class="hero-search" id="hero-search-form" action="services.html" method="get">
            <input
              id="hero-search-input"
              type="search"
              name="q"
              placeholder="What do you need today?"
              autocomplete="off"
              aria-label="Search services"
            />
            <button type="button" class="btn btn-secondary btn-lg" id="hero-search-btn">Search</button>
          </form>
        </div>
      </section>

      <section class="section container">
        <div class="section-head">
          <h2>Shop by category</h2>
          <p>Everyday essentials and special occasions — tap a category to see providers.</p>
        </div>
        <div id="home-categories" class="grid-categories"></div>
        <p style="text-align:center;margin-top:28px;">
          <a class="btn btn-ghost btn-lg" href="categories.html">View all categories</a>
        </p>
      </section>
    </main>
    <footer class="footer-mini">© AVAILT — Local services at your fingertips</footer>
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
