# Switch to MySQL: create database availt, edit credentials in application-mysql.properties, then run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: export SPRING_PROFILES_ACTIVE=mysql
#
# If "Port 8080 is already in use": SERVER_PORT=8081 mvn spring-boot:run

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:availt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false