<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Book — AVAILT</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@600;800&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="page-wrap">
<header th:replace="fragments/nav :: header"></header>
<main class="section container">
    <p class="breadcrumb"><a th:href="@{/service/{id}(id=${service.id})}" th:text="${service.name}">Service</a> / Book</p>
    <h1>Booking details</h1>
    <p th:if="${error}" class="flash error" th:text="${error}"></p>
    <ul th:if="${errors != null}" class="flash error list-errors">
        <li th:each="err : ${errors}" th:text="${err}">Error</li>
    </ul>
    <div class="booking-grid">
        <div class="panel sticky-side">
            <h2 th:text="${service.name}">Service</h2>
            <p class="muted" th:text="${service.category}">Category</p>
            <div th:if="${selectedMenu != null}" class="menu-recap">
                <strong>Selected menu</strong>
                <p th:text="${selectedMenu.menuName}">Name</p>
                <p class="items small" th:text="${selectedMenu.items}">Items</p>
                <p th:text="|₹${selectedMenu.price} per person|">Price</p>
            </div>
        </div>
        <div class="panel">
            <form th:action="@{/book/{id}(id=${service.id})}" method="post" class="stack">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div th:each="f : ${fields}" class="form-group">
                    <label th:for="${f.name}" th:text="${f.label}">Label</label>
                    <textarea th:if="${#strings.toString(f.inputType) == 'textarea'}" th:id="${f.name}" th:name="${f.name}" th:rows="${f.textareaRows}"
                              th:required="${f.required}"></textarea>
                    <input th:unless="${#strings.toString(f.inputType) == 'textarea'}" th:id="${f.name}" th:name="${f.name}" th:type="${f.inputType}" th:required="${f.required}"/>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">Continue to summary</button>
            </form>
        </div>
    </div>
</main>
<footer class="footer-mini">AVAILT — local service booking</footer>
</body>
</html>
