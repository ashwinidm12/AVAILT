<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Log in — AVAILT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="page-wrap">
<header th:replace="fragments/nav :: header"></header>
<main class="container narrow section">
    <div class="panel">
        <h1>Log in</h1>
        <p class="muted">Use the email and password you registered with.</p>
        <p th:if="${registered}" class="flash success">Account created. You can log in now.</p>
        <p th:if="${param.error}" class="flash error">Invalid email or password.</p>
        <form th:action="@{/login}" method="post" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" required/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
        </form>
        <p class="center muted" style="margin-top:1.25rem">New here? <a th:href="@{/signup}">Create an account</a></p>
    </div>
</main>
<footer class="footer-mini">AVAILT — local service booking</footer>
</body>
</html>
