# Switch to MySQL: create database availt, edit credentials in application-mysql.properties, then run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: export SPRING_PROFILES_ACTIVE=mysql
#
# If "Port 8080 is already in use": SERVER_PORT=8081 mvn spring-boot:run

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:availt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.facebook.client-id=${OAUTH2_FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH2_FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture

spring.security.oauth2.client.registration.github.client-id=${OAUTH2_GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH2_GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email

spring.security.oauth2.client.registration.apple.client-id=${OAUTH2_APPLE_CLIENT_ID:}
spring.security.oauth2.client.registration.apple.client-secret=${OAUTH2_APPLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.apple.scope=name,email
spring.security.oauth2.client.registration.apple.client-name=Apple
spring.security.oauth2.client.registration.apple.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.user-info-uri=https://api.apple.com/auth/user
spring.security.oauth2.client.provider.apple.user-name-attribute=sub

# JWT Configuration
app.jwt.secret=${JWT_SECRET:availt-secret-key-for-jwt-token-generation-and-validation-do-not-share-2026}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
