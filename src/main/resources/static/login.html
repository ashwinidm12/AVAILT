<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AVAILT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        
        .auth-card { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 40px; }
        
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 { font-size: 28px; color: #1f2937; margin-bottom: 8px; }
        .auth-header p { color: #6b7280; font-size: 14px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        
        .divider { display: flex; align-items: center; margin: 24px 0; }
        .divider span { flex: 1; height: 1px; background: #e5e7eb; }
        .divider p { padding: 0 12px; color: #9ca3af; font-size: 13px; }
        
        .social-login { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .social-btn { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; font-weight: 500; color: #374151; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .social-btn:hover { background: #f9fafb; border-color: #9ca3af; }
        .social-btn.full { grid-column: 1 / -1; }
        
        .auth-link { text-align: center; margin-top: 20px; color: #6b7280; font-size: 14px; }
        .auth-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .auth-link a:hover { text-decoration: underline; }
        
        .error-message { color: #dc2626; background: #fee2e2; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .success-message { color: #059669; background: #d1fae5; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        
        .loading { display: none; text-align: center; }
        .spinner { width: 20px; height: 20px; border: 3px solid #e5e7eb; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your AVAILT account</p>
            </div>

            <div id="message-container"></div>

            <!-- Email/Password Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" />
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="divider">
                <span></span>
                <p>or continue with</p>
                <span></span>
            </div>

            <!-- Social Login Buttons -->
            <div class="social-login">
                <button class="social-btn" onclick="oauthLogin('google')">
                    <span>🔵 Google</span>
                </button>
                <button class="social-btn" onclick="oauthLogin('facebook')">
                    <span>👥 Facebook</span>
                </button>
                <button class="social-btn" onclick="oauthLogin('github')">
                    <span>🐙 GitHub</span>
                </button>
                <button class="social-btn full" onclick="oauthLogin('apple')">
                    <span>🍎 Sign in with Apple</span>
                </button>
            </div>

            <div class="auth-link">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script>
        const baseURL = window.location.hostname === 'localhost' ? 'http://localhost:8080' : '';

        // Email/Password Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${baseURL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('Login successful!', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        // OAuth2 Login
        function oauthLogin(provider) {
            const redirectUri = `${baseURL}/login/oauth2/code/${provider}`;
            window.location.href = `/oauth2/authorization/${provider}`;
        }

        function showMessage(message, type) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="${type}-message">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
    </script>
</body>
</html>
